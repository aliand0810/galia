<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Onda Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1/dist/mpegts.min.js"></script>
<style>
:root{
  --bg:#0a0e13;--bg2:#10161e;--card:#151d27;--card2:#1b2633;--line:#233142;
  --tx:#e9eef3;--mut:#8b9bac;--acc:#6ee7c8;--acc2:#38bdf8;--danger:#f87171;
  --r:14px;--g:clamp(16px,4vw,48px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Outfit,system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;line-height:1.45}
body.noscroll{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
.hidden{display:none!important}
.mut{color:var(--mut)}
.ic{width:20px;height:20px;flex:none}

/* ---------- Logo ---------- */
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:20px;letter-spacing:.3px;cursor:pointer;user-select:none}
.logo .mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#06231d}
.logo.big{font-size:30px;justify-content:center}
.logo.big .mark{width:46px;height:46px;border-radius:14px}

/* ---------- Buttons / forms ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);font-weight:500;transition:.15s;text-decoration:none;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.2)}
.btn.pri{background:var(--tx);color:#0a0e13}
.btn.pri:hover{background:#fff}
.btn.acc{background:var(--acc);color:#06231d}
.btn.danger{background:rgba(248,113,113,.15);color:var(--danger)}
.btn.wide{width:100%;justify-content:center}
.btn.sm{padding:7px 14px;font-size:13px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:.15s}
.ib:hover{background:rgba(255,255,255,.1)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 0}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select{display:block;width:100%;margin-top:6px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);outline:none;transition:border .15s}
input:focus,select:focus{border-color:var(--acc)}
.chk{display:flex;align-items:center;gap:10px;color:var(--tx);font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
details{margin-top:14px}
summary{cursor:pointer;color:var(--mut);font-size:14px}
.err{background:rgba(248,113,113,.12);color:var(--danger);padding:10px 14px;border-radius:10px;margin:14px 0;font-size:14px}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px;margin-top:18px}
.seg button{flex:1;padding:9px;border-radius:999px;color:var(--mut);font-weight:500}
.seg button.on{background:var(--card2);color:var(--tx)}
.hint{font-size:12px;color:var(--mut);margin-top:6px}

/* ---------- Full screens ---------- */
.screen{min-height:100vh;display:grid;place-items:center;padding:24px var(--g)}
.setup-card{width:100%;max-width:440px;background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:30px}
.setup-card .btn.pri{margin-top:22px}
.setup-card>p{text-align:center;margin:12px 0 0}
#profiles h1{font-weight:500;font-size:clamp(26px,4vw,40px);text-align:center;margin:0 0 30px}
.pgrid{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;max-width:760px}
.pf{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--mut);transition:.15s;width:110px}
.pf:hover{color:var(--tx)}
.pf:hover .av{transform:scale(1.05);box-shadow:0 0 0 3px var(--tx)}
.pf em{display:block;font-style:normal;font-size:11px;color:var(--acc)}
.av{width:100px;height:100px;border-radius:22px;display:grid;place-items:center;font-size:40px;font-weight:600;color:#0a0e13;background:var(--card2);transition:.15s}
.pf.add .av{color:var(--mut);border:2px dashed var(--line);background:none}
.av.sm{width:34px;height:34px;border-radius:10px;font-size:15px}
.pform{margin-top:28px;width:100%;max-width:360px;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:20px}
.colors{display:flex;gap:8px;margin-top:10px}
.colors button{width:28px;height:28px;border-radius:8px}
.colors button.on{box-shadow:0 0 0 2px var(--bg2),0 0 0 4px var(--tx)}
#loader{position:fixed;inset:0;z-index:90;background:rgba(10,14,19,.92);display:grid;place-items:center;text-align:center}
.spin{width:42px;height:42px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:sp 1s linear infinite;margin:0 auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Top bar ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:28px;padding:14px var(--g);padding-top:max(14px,env(safe-area-inset-top));background:linear-gradient(rgba(10,14,19,.85),transparent);transition:background .25s}
.top.solid{background:rgba(10,14,19,.96);backdrop-filter:blur(10px)}
.tnav{display:flex;gap:4px}
.tnav button{padding:8px 14px;border-radius:999px;color:var(--mut);font-weight:500;transition:.15s}
.tnav button:hover{color:var(--tx)}
.tnav button.on{color:var(--tx);background:rgba(255,255,255,.08)}
.tact{margin-left:auto;display:flex;align-items:center;gap:6px}
.bnav{display:none}
main{min-height:100vh;padding-bottom:60px}

/* ---------- Hero ---------- */
.hero{position:relative;height:min(78vh,720px);min-height:440px;display:flex;align-items:flex-end;overflow:hidden}
.hbg{position:absolute;inset:0;background-size:cover;background-position:center 20%;transform:scale(1.04);transition:background-image .4s}
.hbg.poster{filter:blur(28px) brightness(.6);transform:scale(1.2)}
.hfade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,14,19,.92) 0%,rgba(10,14,19,.5) 45%,transparent 75%),linear-gradient(0deg,var(--bg) 0%,transparent 45%)}
.hin{position:relative;padding:0 var(--g) 70px;max-width:640px}
.kicker{display:inline-block;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);margin-bottom:10px}
.hin h1{font-size:clamp(32px,5vw,58px);line-height:1.05;margin:0 0 14px;font-weight:600}
.hin p{color:#cdd6df;margin:0 0 22px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hbtn{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Rows & cards ---------- */
.row{margin:28px 0 8px}
.rh{display:flex;align-items:baseline;justify-content:space-between;padding:0 var(--g);margin-bottom:10px}
.rh h2{font-size:19px;font-weight:500;margin:0}
.link{color:var(--mut);font-size:13px}
.link:hover{color:var(--acc)}
.rail{display:flex;gap:14px;overflow-x:auto;padding:4px var(--g) 14px;scroll-snap-type:x proximity;scrollbar-width:none;align-items:flex-start}
.rail::-webkit-scrollbar{display:none}
.rail .card{width:150px;flex:none;scroll-snap-align:start}
.rail .card.wide{width:230px}
.card{display:flex;flex-direction:column;gap:7px;text-align:left;min-width:0}
.thumb{position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:linear-gradient(145deg,var(--card2),var(--card));transition:transform .2s,box-shadow .2s}
.card.wide .thumb{aspect-ratio:16/9}
.card:hover .thumb,.card:focus-visible .thumb{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 2px var(--acc)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card.wide .thumb img{object-fit:contain;padding:14% 18%}
.ph{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:600;color:#3b4b5e;text-transform:uppercase}
.badges{position:absolute;top:7px;left:7px;display:flex;gap:4px}
.badges i{font-style:normal;font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px;background:rgba(10,14,19,.8);color:var(--acc)}
.num{position:absolute;top:7px;right:8px;font-size:11px;color:var(--mut)}
.favdot{position:absolute;bottom:8px;right:9px;color:var(--acc);font-size:13px}
.pbar{position:absolute;left:8px;right:8px;bottom:8px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--acc)}
.ct{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d5dde5}
.cs{font-size:12px;color:var(--mut);margin-top:-5px}

/* ---------- Pages ---------- */
.page{padding:96px var(--g) 30px}
.page h1{font-size:clamp(24px,3vw,34px);font-weight:600;margin:0}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ghead select{width:auto;margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:12px;scrollbar-width:thin}
.chip{flex:none;padding:8px 16px;border-radius:999px;background:var(--card);color:var(--mut);font-size:14px;border:1px solid transparent;transition:.15s}
.chip:hover{color:var(--tx)}
.chip.on{background:rgba(110,231,200,.12);color:var(--acc);border-color:rgba(110,231,200,.35)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:22px 14px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.sentinel{height:1px;grid-column:1/-1}
.empty{grid-column:1/-1;padding:60px 0;text-align:center;color:var(--mut)}
.live{display:grid;grid-template-columns:260px 1fr;gap:28px}
.cats{position:sticky;top:86px;align-self:start;max-height:calc(100vh - 110px);overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-right:6px;scrollbar-width:thin}
.cat{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:10px;color:var(--mut);text-align:left;font-size:14px}
.cat:hover{background:var(--card);color:var(--tx)}
.cat.on{background:var(--card2);color:var(--tx)}
.cat small{color:#5e6f81}
.lhead{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}
.lhead input{max-width:260px;margin:0}
.search{font-size:18px!important;padding:14px 18px!important;border-radius:14px!important;margin:0 0 6px!important}
.sec{max-width:880px}
.sec h2{font-size:18px;font-weight:500;margin:34px 0 4px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:12px}
.box .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.plist{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;gap:12px}
.prow input{flex:1;margin:0!important}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14px}
.kv span:nth-child(odd){color:var(--mut)}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);overflow-y:auto;padding:40px 16px}
.mbox{position:relative;max-width:920px;margin:0 auto;background:var(--bg2);border-radius:20px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .2s ease}
@keyframes pop{from{transform:translateY(14px);opacity:0}}
.mclose{position:absolute;top:14px;right:14px;z-index:3;width:38px;height:38px;border-radius:50%;background:rgba(10,14,19,.7);display:grid;place-items:center}
.mhero{position:relative;min-height:380px;background-size:cover;background-position:center 25%;display:flex;align-items:flex-end}
.mfade{position:absolute;inset:0;background:linear-gradient(0deg,var(--bg2) 5%,rgba(16,22,30,.55) 50%,rgba(16,22,30,.2))}
.mhin{position:relative;padding:28px}
.mhin h2{font-size:clamp(26px,4vw,40px);margin:0 0 10px;font-weight:600;line-height:1.1}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:#c8d2dc;font-size:14px;margin-bottom:18px}
.meta span+span::before{content:"·";margin-right:14px;color:var(--mut)}
.mcontent{padding:4px 28px 30px}
.plot{font-size:15.5px;color:#d0d8e0;margin:0 0 16px;max-width:720px}
.credits{font-size:13.5px;color:var(--mut)}
.credits b{color:#c3ccd5;font-weight:500}
.vers{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 4px}
.seasons{display:flex;gap:8px;overflow-x:auto;margin:16px 0 14px;padding-bottom:4px}
.eps{display:flex;flex-direction:column;gap:6px}
.ep{display:grid;grid-template-columns:180px 1fr;gap:16px;text-align:left;padding:10px;border-radius:12px;transition:.15s}
.ep:hover{background:var(--card)}
.eth{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--card2)}
.eth img{width:100%;height:100%;object-fit:cover}
.eth .ph{font-size:18px}
.ep b{font-weight:500}
.ep small{color:var(--mut);margin-left:8px}
.ep p{margin:4px 0 0;font-size:13px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- Player ---------- */
.player{position:fixed;inset:0;z-index:70;background:#000;display:flex}
.player video{width:100%;height:100%;background:#000;outline:none}
.p-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;padding:16px 20px;padding-top:max(16px,env(safe-area-inset-top));background:linear-gradient(rgba(0,0,0,.8),transparent);transition:opacity .3s;z-index:2}
.p-title{min-width:0;flex:1}
.p-title b{display:block;font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-title span{color:#b6c1cc;font-size:13px}
.p-actions{display:flex;gap:4px}
.p-actions .ib{background:rgba(255,255,255,.08)}
.p-epg{position:absolute;left:20px;bottom:86px;max-width:min(520px,calc(100% - 40px));display:flex;flex-direction:column;gap:8px;transition:opacity .3s;z-index:2;pointer-events:none}
.p-epg>div{background:rgba(10,14,19,.78);backdrop-filter:blur(6px);padding:10px 14px;border-radius:12px;font-size:14px}
.p-epg small{color:var(--mut);margin-left:6px}
.p-epg .tag{font-size:11px;color:var(--acc);text-transform:uppercase;letter-spacing:1px;margin-right:6px}
.p-epg .bar{height:3px;border-radius:3px;background:rgba(255,255,255,.2);margin-top:8px;overflow:hidden}
.p-epg .bar i{display:block;height:100%;background:var(--acc)}
.player:not(.ui) .p-top,.player:not(.ui) .p-epg{opacity:0;pointer-events:none}
.player:not(.ui){cursor:none}
.p-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(10,14,19,.85);padding:14px 20px;border-radius:12px;max-width:80%;text-align:center;z-index:2}
.p-msg:empty{display:none}
.p-list{position:absolute;top:0;right:0;bottom:0;width:min(340px,86vw);background:rgba(10,14,19,.95);backdrop-filter:blur(10px);z-index:3;display:flex;flex-direction:column}
.p-list header{display:flex;align-items:center;justify-content:space-between;padding:16px}
.p-list .items{overflow-y:auto;flex:1;padding:0 8px 16px}
.zch{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border-radius:10px;text-align:left}
.zch:hover,.zch.on{background:var(--card2)}
.zch .lg{width:54px;height:32px;border-radius:6px;background:var(--card);flex:none;display:grid;place-items:center;overflow:hidden}
.zch .lg img{max-width:100%;max-height:100%;object-fit:contain}
.zch span{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-menu{position:absolute;top:70px;right:20px;z-index:4;background:rgba(16,22,30,.97);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:240px;max-height:70vh;overflow-y:auto}
.p-menu button{display:flex;width:100%;padding:9px 12px;border-radius:9px;font-size:14px;text-align:left;gap:8px}
.p-menu button:hover{background:var(--card2)}
.p-menu button.on{color:var(--acc)}
.p-menu .h{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);padding:8px 12px 4px}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--line);padding:11px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:95;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}

/* ---------- Mobile ---------- */
@media (max-width:820px){
  .tnav{display:none}
  .top{gap:12px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,14,19,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mut);padding:4px 0}
  .bnav button.on{color:var(--acc)}
  main{padding-bottom:90px}
  .rail .card{width:118px}
  .rail .card.wide{width:170px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 10px}
  .grid.wide{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .live{grid-template-columns:1fr;gap:0}
  .cats{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:10px;margin-bottom:10px}
  .cat{flex:none;background:var(--card);border-radius:999px;padding:8px 14px}
  .cat small{display:none}
  .hin{padding-bottom:40px}
  .hero{height:68vh;min-height:400px}
  .ep{grid-template-columns:120px 1fr;gap:12px}
  .mhero{min-height:300px}
  .mhin,.mcontent{padding-left:18px;padding-right:18px}
  .modal{padding:0}
  .mbox{border-radius:0;min-height:100%}
  .two{grid-template-columns:1fr}
  .p-actions .lbl{display:none}
  #toast{bottom:100px}
}
</style>
</head>
<body>

<div id="setup" class="screen hidden"></div>
<div id="profiles" class="screen hidden" style="flex-direction:column;align-items:center;justify-content:center"></div>
<div id="app" class="hidden">
  <header class="top" id="top"></header>
  <main id="main"></main>
  <nav class="bnav" id="bnav"></nav>
</div>

<div id="modal" class="modal hidden"><div class="mbox"><button class="mclose" id="mClose" aria-label="Fermer"></button><div id="mbody"></div></div></div>

<div id="player" class="player hidden">
  <video id="vid" playsinline controls></video>
  <div class="p-top">
    <button class="ib" id="pBack" aria-label="Retour"></button>
    <div class="p-title"><b id="pTitle"></b><span id="pSub"></span></div>
    <div class="p-actions">
      <button class="ib" id="pNext" title="Épisode suivant"></button>
      <button class="ib" id="pZap" title="Chaînes"></button>
      <button class="ib" id="pTracks" title="Pistes audio, sous-titres, qualité"></button>
      <button class="ib" id="pPip" title="Picture-in-Picture"></button>
      <button class="ib" id="pFs" title="Plein écran"></button>
    </div>
  </div>
  <div id="pEpg" class="p-epg"></div>
  <div id="pMsg" class="p-msg"></div>
  <aside id="pList" class="p-list hidden"><header><b>Chaînes</b><button class="ib" id="pListClose"></button></header><div class="items" id="pItems"></div></aside>
  <div id="pMenu" class="p-menu hidden"></div>
</div>

<div id="loader" class="hidden"><div><div class="spin"></div><div id="loaderTxt">Chargement…</div></div></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
   Onda Player — lecteur IPTV (Xtream Codes / M3U)
   Fichier unique · PWA · aucune donnée envoyée ailleurs que
   vers votre serveur IPTV, le proxy choisi et TMDB (optionnel)
   ========================================================= */

/* ---------- Utilitaires ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cssu = u => String(u || '').replace(/["'()\\\s]/g, c => encodeURIComponent(c));
const uid = () => Math.random().toString(36).slice(2, 10);

/* ---------- Réseau / proxy ---------- */
function needProxy(url) {
  const m = S.cfg.proxyMode;
  if (!S.cfg.proxy || m === 'never') return false;
  if (m === 'always') return true;
  return location.protocol === 'https:' && /^http:/i.test(url);
}
function px(url) { const p = S.cfg.proxy || ''; if (!p) return url; return p.includes('{url}') ? p.replace('{url}', encodeURIComponent(url)) : p + encodeURIComponent(url); }
async function getText(url) {
  const tries = needProxy(url) ? [px(url)] : (S.cfg.proxy && S.cfg.proxyMode !== 'never' ? [url, px(url)] : [url]);
  let err;
  for (const t of tries) {
    try { const r = await fetch(t); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.text(); }
    catch (e) { err = e; }
  }
  throw new Error('Connexion impossible (' + (err?.message || 'réseau') + '). Vérifiez l’adresse ou le proxy.');
}
async function getJSON(url) { const t = await getText(url); try { return JSON.parse(t); } catch { throw new Error('Réponse invalide du serveur.'); } }
const srv = () => S.cfg.server.trim().replace(/\/+$/, '');
const cred = () => encodeURIComponent(S.cfg.user) + '/' + encodeURIComponent(S.cfg.pass);

  if (action) u.searchParams.set('action', action);
  for (const [k, v] of Object.entries(extra)) u.searchParams.set(k, v);

}

/* ---------- Normalisation des noms ---------- */
function clean(n) {
  let s = String(n || '');
  s = s.replace(/^\s*[\[\(|]\s*[A-Z0-9 ]{2,8}\s*[\]\)|]\s*[-:|]?\s*/, '');
  s = s.replace(/^\s*[A-Z]{2,3}\s*[|:]\s*/, '');
  s = s.replace(/\b(4k|uhd|2160p|fhd|1080p|hd|720p|sd|480p|hevc|h\.?265|x265|h\.?264)\b/gi, '');
  s = s.replace(/[\[\(]\s*[\]\)]/g, '').replace(/\s{2,}/g, ' ').replace(/[\s|\-–:]+$/, '').trim();
  return s || String(n || '');
}
const bkey = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
function quality(n) { const s = String(n).toLowerCase(); if (/\b(4k|uhd|2160p?)\b/.test(s)) return '4K'; if (/\b(fhd|1080p?)\b/.test(s)) return 'FHD'; if (/\b(hd|720p?)\b/.test(s)) return 'HD'; if (/\b(sd|480p?)\b/.test(s)) return 'SD'; return ''; }
function groupItems(list, byCat) {
  const m = new Map(), out = [];
  for (const it of list) {
    const g = (byCat ? it.cat + '|' : '') + it.bk;
    const h = m.get(g);
    if (!h) { it.vers = [it]; m.set(g, it); out.push(it); } else h.vers.push(it);
  }
  for (const h of out) if (h.vers.length > 1) h.vers.sort((a, b) => QRANK[b.q] - QRANK[a.q]);
  return out;
}

function parseM3U(txt) {

      } else if (/\/movie\//i.test(url) || /\.(mp4|mkv|avi|m4v)(\?|$)/i.test(url)) {

async function loadCatalog(force) {
  const key = 'cat_' + srcHash();
  if (!force) {
    const c = await IDB.get(key);
    if (c && Date.now() - c.ts < (S.cfg.cacheH || 12) * 3600e3) { applyCatalog(c); return; }
  }
  try {
    const raw = S.cfg.type === 'xtream' ? await loadXtream() : await loadM3U();
    raw.ts = Date.now();
    await IDB.set(key, raw);
    applyCatalog(raw);
  } catch (e) {
    const c = await IDB.get(key);
    if (c && !force) { applyCatalog(c); toast('Hors ligne : catalogue en cache utilisé'); }
    else throw e;
  } finally { loader(false); }
}
function applyCatalog(raw) {
  S.raw = raw; S.idx = new Map(); S.adult = new Set(); S._bc = {}; S.sc = {};
  for (const k of ['live', 'vod', 'series']) {
    for (const [id, n] of Object.entries(raw.cats[k] || {})) if (ADULT.test(n)) S.adult.add(k + ':' + id);
    for (const it of raw[k]) { it.title = clean(it.name); it.bk = bkey(it.title); it.q = quality(it.name); S.idx.set(it.k + ':' + it.id, it); }
  }

function card(it, o = {}) {
  const wide = it.k === 'live';
  const badges = [...new Set((it.vers || []).map(v => v.q).filter(Boolean))].slice(0, 3);
  const attr = o.resume ? `data-resume="${esc(o.resume)}"` : `data-key="${esc(kk(it))}"`;
  return `<button class="card${wide ? ' wide' : ''}" ${attr} title="${esc(it.title)}">
    <div class="thumb"><span class="ph">${esc(initials(it.title))}</span>${it.img ? `<img loading="lazy" src="${esc(it.img)}" alt="" onerror="this.remove()">` : ''}
    ${badges.length ? `<span class="badges">${badges.map(b => `<i>${b}</i>`).join('')}</span>` : ''}
    ${wide && it.num ? `<span class="num">${it.num}</span>` : ''}
    ${o.p != null ? `<span class="pbar"><i style="width:${Math.min(100, Math.round(o.p * 100))}%"></i></span>` : (S.idx.size && isFav(it) ? '<span class="favdot">♥</span>' : '')}</div>
    <span class="ct">${esc(it.title)}</span>${o.sub ? `<span class="cs">${esc(o.sub)}</span>` : ''}</button>`;
}
function rowHTML(title, items, o = {}) {
  if (!items.length) return '';
  return `<section class="row"><div class="rh"><h2>${esc(title)}</h2>${o.more ? `<button class="link" data-more="${esc(o.more)}">Tout voir →</button>` : ''}</div><div class="rail">${items.map(x => o.map ? o.map(x) : card(x)).join('')}</div></section>`;
}
function pager(container, list, fn, step = 96) {
  container.innerHTML = '';
  if (!list.length) { container.innerHTML = '<div class="empty">Aucun contenu ici.</div>'; return; }
  const sent = document.createElement('div'); sent.className = 'sentinel'; container.appendChild(sent);
  let n = 0;
  const more = () => {
    const chunk = list.slice(n, n + step); n += chunk.length;
    sent.insertAdjacentHTML('beforebegin', chunk.map(fn).join(''));
    if (n >= list.length) { io.disconnect(); sent.remove(); }
  };
  if (S.io) S.io.disconnect();
  const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) more(); }, {rootMargin: '900px'});
  S.io = io; more(); if (n < list.length) io.observe(sent);
}

/* ---------- TMDB (facultatif) ---------- */
async function tmdb(type, title, year) {
  const key = S.cfg.tmdb; if (!key || !title) return null;
  const t = title.replace(/\((19|20)\d{2}\)/, '').trim();
  const y = year || (title.match(/\b(19|20)\d{2}\b/) || [])[0] || '';
  const ck = 'tm_' + type + '_' + bkey(t) + y;
  const c = await IDB.get(ck); if (c) return c;
  try {
    const bearer = key.length > 40;
    const u = new URL('https://api.themoviedb.org/3/search/' + type);
    u.searchParams.set('query', t); u.searchParams.set('language', 'fr-FR');
    if (y) u.searchParams.set(type === 'tv' ? 'first_air_date_year' : 'year', y);
    if (!bearer) u.searchParams.set('api_key', key);
    const r = await fetch(u, {headers: bearer ? {Authorization: 'Bearer ' + key} : {}}).then(r => r.json());
    const x = r.results && r.results[0]; if (!x) return null;
    const o = {plot: x.overview || '', backdrop: x.backdrop_path ? 'https://image.tmdb.org/t/p/w1280' + x.backdrop_path : '', poster: x.poster_path ? 'https://image.tmdb.org/t/p/w500' + x.poster_path : '', rating: x.vote_average || 0, year: (x.release_date || x.first_air_date || '').slice(0, 4)};
    IDB.set(ck, o); return o;
  } catch { return null; }
}

async function getSeasons(it) {
  if (S.sc[it.id]) return S.sc[it.id];
  let data;
  if (it.eps) {
    const seasons = {};
    for (const e of it.eps) (seasons[e.s] ||= []).push(e);
    Object.values(seasons).forEach(l => l.sort((a, b) => a.e - b.e));
    data = {info: {}, seasons};
  } else {
    const r = await api('get_series_info', {series_id: it.id});
    const seasons = {}, eps = r.episodes || {};
    const ent = Array.isArray(eps) ? eps.map((l, i) => [String(i + 1), l]) : Object.entries(eps);
    for (const [s, l] of ent) seasons[s] = (l || []).map(e => ({id: String(e.id), s, e: +e.episode_num || 0, title: clean(e.title || 'Épisode ' + e.episode_num), ext: e.container_extension || 'mp4', img: e.info?.movie_image || '', plot: e.info?.plot || '', dur: e.info?.duration || ''})).sort((a, b) => a.e - b.e);
    data = {info: r.info || {}, seasons};

}
const seasonKeys = d => Object.keys(d.seasons).filter(k => d.seasons[k].length).sort((a, b) => a - b);
const lastEpOf = it => Object.entries(S.pdata.prog).filter(([, e]) => e.meta.type === 'ep' && e.meta.sid === it.id).sort((a, b) => b[1].ts - a[1].ts)[0];

function liveCands(it) { if (it.url) return [it.url]; const b = `${srv()}/live/${cred()}/${it.id}`; return S.cfg.liveFmt === 'ts' ? [b + '.ts', b + '.m3u8'] : [b + '.m3u8', b + '.ts']; }

function stopEngines() {
  const v = vid(); v.onerror = null;
  try { hls && hls.destroy(); } catch {} hls = null;
  try { if (mts) { mts.pause(); mts.unload(); mts.detachMediaElement(); mts.destroy(); } } catch {} mts = null;
  v.removeAttribute('src'); try { v.load(); } catch {}
}
function attach(url, live, fail) {
  stopEngines();
  const v = vid(); let failed = false;
  const onFail = () => { if (!failed) { failed = true; fail(); } };
  const isM3U8 = /\.m3u8(\?|$)/i.test(url), isTS = /\.ts(\?|$)/i.test(url);
  const isFile = /\.(mp4|mkv|webm|m4v|avi|mov)(\?|$)/i.test(url);
  const direct = needProxy(url) ? px(url) : url;
  if (isM3U8 && window.Hls && Hls.isSupported()) {
    hls = new Hls({enableWorker: true, lowLatencyMode: false, backBufferLength: 60, xhrSetup: (xhr, u) => { if (needProxy(u)) xhr.open('GET', px(u), true); }});
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) { if (d.type === Hls.ErrorTypes.MEDIA_ERROR) { try { hls.recoverMediaError(); return; } catch {} } onFail(); } });
    hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
    hls.loadSource(url); hls.attachMedia(v);
  } else if (isM3U8 && v.canPlayType('application/vnd.apple.mpegurl')) {
    v.onerror = onFail; v.src = direct; v.play().catch(() => {});
  } else if ((isTS || (live && !isFile && !isM3U8)) && window.mpegts && mpegts.isSupported()) {
    mts = mpegts.createPlayer({type: 'mpegts', isLive: live, url: direct}, {enableWorker: true, liveBufferLatencyChasing: live, lazyLoad: !live, autoCleanupSourceBuffer: true});
    mts.on(mpegts.Events.ERROR, onFail);
    mts.attachMediaElement(v); mts.load();
    const p = mts.play(); p && p.catch && p.catch(() => {});
  } else {
    v.onerror = onFail; v.src = direct; v.play().catch(() => {});
  }
}
function startPlayback(cands, live, at) {
  let i = 0;
  const go = () => {
    if (!S.P) return;
    if (i >= cands.length) { pMsg('Lecture impossible. Essayez l’autre format (Paramètres → Format des chaînes) ou activez le proxy.'); return; }
    const url = cands[i++];
    pMsg(i > 1 ? 'Nouvel essai…' : '');
    attach(url, live, go);
    vid().addEventListener('playing', () => pMsg(''), {once: true});
    if (at) vid().addEventListener('loadedmetadata', () => { try { vid().currentTime = at; toast('Reprise à ' + mmss(at)); } catch {} }, {once: true});
  };

}

function saveProgress(force) {
  const o = S.P; if (!o || o.live || !o.key) return;
  const v = vid(), d = v.duration, t = v.currentTime;
  if (!d || !isFinite(d) || t < 5) return;

}

function playVod(v, resume) {
  openPlayer({title: v.title, sub: [v.q, catName('vod', v.cat)].filter(Boolean).join(' · '), img: v.img, cands: vodCands(v), key: 'vod:' + v.id, resume,
    meta: {type: 'vod', id: v.id, ext: v.ext, url: v.url, title: v.title, img: v.img}});
}
function playEp(it, data, s, i) {
  const list = data.seasons[s], ep = list[i]; if (!ep) return;
  const keys = seasonKeys(data); let next = null;
  if (i + 1 < list.length) next = () => playEp(it, data, s, i + 1);
  else { const ni = keys.indexOf(String(s)) + 1; if (ni > 0 && ni < keys.length) next = () => playEp(it, data, keys[ni], 0); }
  const sub = `S${s} E${ep.e}`;
  openPlayer({title: it.title, sub: sub + ' — ' + ep.title, img: it.img, cands: epCands(ep), key: 'ep:' + ep.id, next,
    meta: {type: 'ep', id: ep.id, ext: ep.ext, url: ep.url, sid: it.id, title: it.title, img: it.img, sub, s: String(s)}});
}
function playLive(it, ctx) {

  const best = it.vers ? it.vers[0] : it;
  const lr = LS.get('lr_' + S.pid, []).filter(x => x !== it.id); lr.unshift(it.id); LS.set('lr_' + S.pid, lr.slice(0, 20));

  openPlayer({title: m.title, sub: m.sub, img: m.img, cands: epCands(m), key, meta: m});
}

document.addEventListener('click', e => {
  if (e.target.closest('#modal, #player, #setup, #profiles')) return;
  const r = e.target.closest('[data-resume]'); if (r) return resume(r.dataset.resume);
  const c = e.target.closest('[data-key]'); if (c) return openItem(S.idx.get(c.dataset.key));
  const mo = e.target.closest('[data-more]');
  if (mo) { const [k, cat] = mo.dataset.more.split('|'); if (cat) (S.gs[k] ||= {sort: 'recent'}).cat = cat; else if (S.gs[k]) S.gs[k].cat = 'all'; return nav(k); }
  const n = e.target.closest('[data-nav]'); if (n) return nav(n.dataset.nav);
  const gc = e.target.closest('[data-gcat]'); if (gc) { S.gs[S.view].cat = gc.dataset.gcat; return render(); }
  const lc = e.target.closest('[data-lcat]'); if (lc) { S.ls.cat = lc.dataset.lcat; S.ls.f = ''; render(); return scrollTo(0, 0); }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (S.P) {
    const v = vid();
    if (e.key === 'Escape') { if (!$('#pMenu').classList.contains('hidden')) $('#pMenu').classList.add('hidden'); else if (!$('#pList').classList.contains('hidden')) $('#pList').classList.add('hidden'); else if (!document.fullscreenElement) closePlayer(); }
    else if (e.key === 'f') toggleFs();
    else if (e.key === ' ' || e.key === 'k') { e.preventDefault(); v.paused ? v.play() : v.pause(); }
    else if (S.P.live && (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'PageUp' || e.key === 'PageDown')) { e.preventDefault(); zap(/Up/.test(e.key) ? -1 : 1); }
    else if (!S.P.live && e.key === 'ArrowRight') { e.preventDefault(); v.currentTime += 10; }
    else if (!S.P.live && e.key === 'ArrowLeft') { e.preventDefault(); v.currentTime -= 10; }
    else if (e.key === 'm') v.muted = !v.muted;
    else if (e.key === 'n' && S.P.next) S.P.next();
    pokeUI(); return;
  }
  if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')) return closeModal();
  if (e.key === '/' && !$('#app').classList.contains('hidden')) { e.preventDefault(); nav('search'); }
});

/* ---------- PWA ---------- */
(function pwa() {
  const icon = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7c8"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#g)"/><path d="M96 268c40-64 80-64 120 0s80 64 120 0 60-40 80-40" fill="none" stroke="#06231d" stroke-width="42" stroke-linecap="round"/></svg>');
  const base = location.href.split('#')[0].split('?')[0];
  const man = {name: 'Onda Player', short_name: 'Onda', start_url: base, scope: base.replace(/[^/]*$/, ''), display: 'standalone', background_color: '#0a0e13', theme_color: '#0a0e13', icons: [{src: icon, sizes: 'any', type: 'image/svg+xml', purpose: 'any maskable'}]};
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man)); document.head.appendChild(l);
  const a = document.createElement('link'); a.rel = 'apple-touch-icon'; a.href = icon; document.head.appendChild(a);
  const f = document.createElement('link'); f.rel = 'icon'; f.href = icon; document.head.appendChild(f);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();

/* ---------- Démarrage ---------- */
function afterLoad() {
  if (!S.profiles.length) { S.profiles = [{id: uid(), name: 'Moi', color: COLORS[0], kids: false}]; LS.set('profiles', S.profiles); }
  if (S.pid && S.profiles.some(p => p.id === S.pid) && S.profiles.length === 1) selectProfile(S.pid);
  else showProfiles();
}
(async function boot() {
  buildShell();
  if (!configured()) return showSetup();
  try { await loadCatalog(false); afterLoad(); }
  catch (e) { showSetup(e.message); }
})();
</script>
